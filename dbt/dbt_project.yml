name: qcommerce
version: "0.1.0"
config-version: 2
profile: qcommerce

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Days of change history the incremental facts re-check on every run (late events, refunds).
  incremental_lookback_hours: 6
  local_timezone: Asia/Kolkata

models:
  qcommerce:
    +on_table_exists: replace
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: gold
      +materialized: table

tests:
  qcommerce:
    +severity: error
