# Iceberg tables written by the Spark CDC writer; same JDBC catalog name ("lakehouse") as Spark uses.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://platform-db:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_DB_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse/
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
# Allow short retention for the demo / CI; production keeps the 7d default.
iceberg.expire-snapshots.min-retention=1h
iceberg.remove-orphan-files.min-retention=1h
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
