name: keepalive

# GitHub disables scheduled workflows in public repos after 60 days without repository activity.
# Re-enabling them through the API keeps the refresh schedule alive without dummy commits.
on:
  schedule:
    - cron: "41 3 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in refresh.yml keepalive.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable"
            echo "$wf: $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" --jq .state)"
          done
